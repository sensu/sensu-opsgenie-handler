name: Go Test

on: [push]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    - name: Set up Go 1.27
      uses: actions/setup-go@v5
      with:
        go-version: 1.27
      id: go
    - name: Test
      run: go test -v ./...
